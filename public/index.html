<!doctype html>
<html lang="nl" data-theme="water">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#071118">
<title>Wasbeer</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦝</text></svg>">
</head>
<body>

<canvas id="ambient" aria-hidden="true"></canvas>

<header class="topbar">
  <h1><span class="logo" id="logo">🦝</span> Wasbeer</h1>
  <div class="topbar-actions">
    <button id="theme-btn" class="icon-btn" title="Thema" aria-label="Thema wisselen">&#9728;</button>
    <button id="refresh" class="icon-btn" title="Verversen" aria-label="Verversen">&#10227;</button>
  </div>
</header>

<main>
  <section id="banner" class="banner" hidden></section>

  <div class="cols">
    <div class="col-main">
      <section class="card status" aria-live="polite">

        <div class="machine">
          <svg class="drum-svg" viewBox="0 0 200 200" role="img" aria-labelledby="drum-label">
            <title id="drum-label">Toestand van de machine</title>
            <defs>
              <clipPath id="porthole"><circle cx="100" cy="100" r="60"/></clipPath>
              <linearGradient id="glassShine" x1="0" y1="0" x2="0.6" y2="1">
                <stop offset="0%" stop-color="#fff" stop-opacity=".3"/>
                <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
            </defs>

            <circle class="ring-track" cx="100" cy="100" r="80"/>
            <circle id="ring" class="ring-progress" cx="100" cy="100" r="80"/>
            <circle class="glass" cx="100" cy="100" r="60"/>

            <g clip-path="url(#porthole)">
              <g id="water" class="water"><path id="wave" class="wave" d=""/></g>
              <g id="drum" class="drum">
                <g class="holes" id="holes"></g>
                <ellipse class="sock a" cx="100" cy="62"  rx="17" ry="11"/>
                <ellipse class="sock b" cx="133" cy="112" rx="15" ry="12"/>
                <ellipse class="sock c" cx="72"  cy="122" rx="18" ry="10"/>
                <ellipse class="sock d" cx="100" cy="100" rx="12" ry="9"/>
              </g>
              <g id="bubbles" class="bubbles"></g>
              <circle cx="100" cy="100" r="60" fill="url(#glassShine)" pointer-events="none"/>
            </g>

            <circle class="rim" cx="100" cy="100" r="60"/>
            <circle class="hinge" cx="33" cy="100" r="4"/>
          </svg>

          <div class="machine-read">
            <div id="state-text" class="state-text">Verbinden…</div>
            <div id="state-sub" class="muted small"></div>
            <div id="remaining" class="remaining"></div>
            <div id="eta" class="muted small"></div>
          </div>
        </div>

        <div id="phases" class="phases"></div>
        <div id="current-opts" class="chips"></div>
        <div id="controls" class="controls"></div>
      </section>
    </div>

    <div class="col-side">
      <section class="section-head">
        <h2>Favorieten</h2>
        <button id="add" class="ghost-btn">+ Nieuw</button>
      </section>
      <section id="favourites" class="grid"></section>
      <p id="empty" class="muted center" hidden>Nog geen favorieten. Maak er een met <b>+ Nieuw</b>.</p>
    </div>
  </div>
</main>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grip"></div>
    <h3 id="sheet-title"></h3>
    <div id="sheet-body"></div>
    <div id="sheet-actions" class="sheet-actions"></div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
